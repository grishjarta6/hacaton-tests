<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Островок!</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Левое окно: чат с ИИ -->
  <aside class="window left-window" id="leftWindow">
    <div class="window-inner">
      <div class="window-top top-left">
        <button class="btn">История</button>
        <button class="btn collapse-trigger" data-toggle="leftWindow" title="Сжать окно">—</button>
      </div>

      <div class="chat">
        <div class="chat-msg user">Привет! Подскажи, куда поехать летом?</div>
        <div class="chat-msg ai">Привет! Рекомендую остров Бали — там прекрасные пляжи и тёплый океан.</div>
        <div class="chat-msg user">А что насчёт Мальдив?</div>
        <div class="chat-msg ai">Мальдивы — отличный выбор для спокойного отдыха. Кристально чистая вода и уединённые виллы.</div>
      </div>

      <div class="chat-bar">
        <input class="chat-input" type="text" placeholder="Напишите запрос..." />
        <button class="chat-send" title="Отправить">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.5"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>
    <button class="window-restore" data-toggle="leftWindow" title="Развернуть">☰</button>
  </aside>

  <!-- Шапка -->
  <header class="header">
    <button class="btn login-btn">Войти / Регистрация</button>
    <h1 class="logo">Островок!</h1>
  </header>

  <!-- Сетка (бесконечный скролл) -->
  <main class="main">
    <div class="grid" id="grid"></div>
  </main>

  <!-- Правое окно: фильтры -->
  <aside class="window right-window" id="rightWindow">
    <div class="window-inner">
      <div class="window-top top-right">
        <button class="btn collapse-trigger" data-toggle="rightWindow" title="Скрыть окно">—</button>
        <input class="search-input" type="text" placeholder="Поиск фильтров..." />
      </div>

      <div class="filters">
        <label class="filter-item"><input type="checkbox" hidden /><span class="filter-circle"></span><span>Пляжи</span></label>
        <label class="filter-item"><input type="checkbox" hidden /><span class="filter-circle"></span><span>Горы</span></label>
        <label class="filter-item"><input type="checkbox" hidden /><span class="filter-circle"></span><span>Города</span></label>
        <label class="filter-item"><input type="checkbox" hidden /><span class="filter-circle"></span><span>Острова</span></label>
        <label class="filter-item"><input type="checkbox" hidden /><span class="filter-circle"></span><span>Экскурсии</span></label>
        <label class="filter-item"><input type="checkbox" hidden /><span class="filter-circle"></span><span>Гастрономия</span></label>
        <label class="filter-item"><input type="checkbox" hidden /><span class="filter-circle"></span><span>Сёрфинг</span></label>
        <label class="filter-item"><input type="checkbox" hidden /><span class="filter-circle"></span><span>Дайвинг</span></label>
        <label class="filter-item"><input type="checkbox" hidden /><span class="filter-circle"></span><span>Термальные источники</span></label>
        <label class="filter-item"><input type="checkbox" hidden /><span class="filter-circle"></span><span>Национальные парки</span></label>
        <label class="filter-item"><input type="checkbox" hidden /><span class="filter-circle"></span><span>Йога-ретриты</span></label>
        <label class="filter-item"><input type="checkbox" hidden /><span class="filter-circle"></span><span>Семейный отдых</span></label>
        <label class="filter-item"><input type="checkbox" hidden /><span class="filter-circle"></span><span>Велотуры</span></label>
        <label class="filter-item"><input type="checkbox" hidden /><span class="filter-circle"></span><span>Кемпинг</span></label>
        <label class="filter-item"><input type="checkbox" hidden /><span class="filter-circle"></span><span>Спа-курорты</span></label>
      </div>
    </div>
    <button class="window-restore" data-toggle="rightWindow" title="Развернуть">☰</button>
  </aside>

  <script src="script.js"></script>
</body>
</html>
